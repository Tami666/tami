<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>血染钟楼 · 玩家笔记</title>
<style>
:root{--bg:#f4f1ea;--paper:#fffdf8;--ink:#24211d;--muted:#7e776d;--line:#ddd5c8;--soft:#eee8de;--shadow:0 8px 30px rgba(50,40,25,.08);--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1120px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.96);backdrop-filter:blur(12px);padding:8px 0 12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.setup{padding:0;overflow:hidden}.setup-summary{width:100%;min-height:48px;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;font-weight:800;text-align:left}.setup-summary-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.setup-arrow{font-size:18px;color:var(--muted)}.setup-details{padding:2px 16px 14px;border-top:1px solid var(--soft)}.setup.collapsed .setup-details{display:none}.setup.collapsed .setup-summary{min-height:44px;padding-top:9px;padding-bottom:9px}.setup-line{display:flex;align-items:end;gap:14px;flex-wrap:wrap;padding-top:12px}.title{font-size:17px;font-weight:800;margin-right:auto;align-self:center}.small-label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}.count-wrap{display:flex;align-items:center;gap:7px}.number{width:62px;padding:8px;border:1px solid var(--line);border-radius:10px;background:white;text-align:center}.config{margin-top:12px;padding-top:12px;border-top:1px solid var(--soft);display:flex;align-items:end;gap:10px;flex-wrap:wrap}.cfg{display:flex;flex-direction:column;gap:3px}.cfg input{width:62px;padding:8px;border:1px solid var(--line);border-radius:10px;text-align:center;background:white}.slash{color:var(--muted);padding-bottom:9px;font-weight:700}.hint{font-size:12px;color:var(--muted)}.ghost{border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:8px 11px}
.main-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:16px;margin-top:16px}.section{padding:16px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:16px;margin-bottom:12px}.section-actions{display:flex;align-items:center;gap:8px}.privacy-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:6px 9px;font-size:11px;font-weight:800;white-space:nowrap}.privacy-btn.hidden-on{background:#2e2b27;color:#fff;border-color:#2e2b27}.players{display:flex;flex-direction:column;gap:7px}
.player{display:grid;grid-template-columns:36px minmax(72px,1fr) auto 28px auto;align-items:center;gap:6px;border:1px solid var(--soft);border-radius:11px;padding:6px 8px;background:#fff}.seat{width:32px;height:32px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:#68645f;font-weight:850;font-size:13px;user-select:none;padding:0;transition:.12s ease}.seat.town{background:#dcebd9;color:#35563b}.seat.outsider{background:#f3e3a5;color:#6d5a16}.seat.wolf{background:#ecc8c3;color:#7b342d}.seat.mine{outline:2px solid #171717;outline-offset:2px}.role{width:100%;min-width:0;border:0;outline:0;padding:6px 2px;background:transparent;font-size:14px}.role.masked{letter-spacing:2px;color:#8b857c}.status{width:26px;height:28px;border:0;background:transparent;font-size:17px;padding:0}.state-tag{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:5px 7px;font-size:11px;font-weight:750;line-height:1;white-space:nowrap;min-height:27px}.state-tag.suspect{background:#f5eedc;border-color:#c7b275;color:#796522}.state-tag.confirm{background:#e6f0e7;border-color:#9fb6a1;color:#4f6b52}.notes-toggle{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;padding:5px 1px;white-space:nowrap}.notes-toggle.has-notes{color:var(--ink)}.player.dead{opacity:.52}.player.dead .role:not(.masked){text-decoration:line-through}.player.dead .seat{filter:grayscale(.45)}
.player-notes{grid-column:1/-1;border-top:1px dashed var(--line);padding:8px 1px 2px;margin-top:2px}.player-notes.collapsed{display:none}.note-form{display:flex;gap:6px}.note-input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 9px;outline:none;font-size:13px}.note-add{border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:7px 10px;font-weight:800}.note-list{display:flex;flex-direction:column;gap:5px;margin-top:7px}.note-row{display:grid;grid-template-columns:24px minmax(0,1fr) 24px;align-items:start;gap:5px;padding:5px 3px;border-radius:8px}.note-row.pinned{background:#f7f2e6}.note-check{width:19px;height:19px;margin:1px 0 0 1px}.note-text{font-size:13px;line-height:1.4;word-break:break-word;white-space:pre-wrap}.note-del{border:0;background:transparent;color:#aaa196;font-size:16px;padding:0}.note-empty{font-size:12px;color:var(--muted);padding:3px 1px}
.info-form,.timeline-form{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:8px;margin-bottom:10px}select,input.text{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none;padding:9px 10px}.primary{border:0;border-radius:10px;background:var(--ink);color:white;padding:9px 13px;font-weight:700}.list{display:flex;flex-direction:column;gap:7px}.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;background:#fff;border:1px solid var(--soft);border-radius:11px;padding:9px 10px}.item.from-note{background:#fffaf0}.tag{white-space:nowrap;background:var(--soft);border-radius:8px;padding:3px 7px;font-weight:700;font-size:12px}.item-text{white-space:pre-wrap;word-break:break-word;line-height:1.45}.del{border:0;background:transparent;color:#a39a8e;font-size:16px;padding:0 3px}.timeline-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.phase{font-size:22px;font-weight:900;min-width:44px}.phase-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px}.timeline-list{max-height:420px;overflow:auto}.phase-group{margin-top:12px}.phase-group:first-child{margin-top:0}.phase-label{position:sticky;top:0;background:var(--paper);font-size:13px;font-weight:900;color:var(--muted);padding:5px 0}.empty{font-size:13px;color:var(--muted);padding:12px 2px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:18px 4px 28px}
.boot{position:fixed;inset:0;background:rgba(30,27,23,.36);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:20px}.boot.hidden{display:none}.boot-box{width:min(420px,100%);padding:22px}.boot-title{font-size:24px;font-weight:900;margin-bottom:5px}.boot-sub{color:var(--muted);font-size:13px;margin-bottom:18px}.boot-row{display:flex;gap:8px}.boot-row input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:18px}.wide{padding:12px 16px}
@media(max-width:800px){.app{padding:10px}.main-grid{grid-template-columns:1fr}.top{padding-top:4px}.title{font-size:15px}.section{padding:11px}.section-title .hint{display:none}.player{grid-template-columns:34px minmax(60px,1fr) auto 25px auto;gap:4px;padding:5px 6px}.seat{width:30px;height:30px}.role{font-size:13px}.state-tag{font-size:10px;padding:5px 5px;min-height:26px}.notes-toggle{font-size:10px}.privacy-btn{font-size:10px;padding:6px 7px}.info-form,.timeline-form{grid-template-columns:72px minmax(0,1fr)}.info-form .primary,.timeline-form .primary{grid-column:2}.setup-summary{padding-left:13px;padding-right:13px}.setup-details{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="boot-box card"><div class="boot-title">开一局</div><div class="boot-sub">输入玩家总人数。之后可以随时修改。</div><div class="boot-row"><input id="bootCount" type="number" min="1" max="30" value="12" inputmode="numeric"><button class="primary wide" id="startBtn" type="button">开始记</button></div></div></div>
<div class="app">
<div class="top"><div class="card setup" id="setupCard"><button class="setup-summary" id="setupToggle" type="button" aria-expanded="true"><span class="setup-summary-text" id="setupSummaryText">12人 · 7 / 2 / 2 / 1</span><span class="setup-arrow" id="setupArrow">⌃</span></button><div class="setup-details"><div class="setup-line"><div class="title">局面设置</div><div><span class="small-label">总人数</span><div class="count-wrap"><input class="number" id="playerCount" type="number" min="1" max="30"><button class="ghost" id="applyCount" type="button">应用</button></div></div><div><span class="small-label">我的号码</span><input class="number" id="mySeat" type="number" min="1" max="30" placeholder="空"></div><button class="ghost" id="clearAll" type="button">新开一局</button></div><div class="config"><div class="cfg"><span class="small-label">镇民</span><input id="townsfolk" type="number" min="0"></div><span class="slash">/</span><div class="cfg"><span class="small-label">外来者</span><input id="outsiders" type="number" min="0"></div><span class="slash">/</span><div class="cfg"><span class="small-label">爪牙</span><input id="minions" type="number" min="0"></div><span class="slash">/</span><div class="cfg"><span class="small-label">恶魔</span><input id="demons" type="number" min="0"></div><button class="ghost" id="standardCfg" type="button">恢复默认配置</button><span class="hint" id="cfgHint"></span></div></div></div></div>
<div class="main-grid"><div><section class="card section"><div class="section-title"><span>身份板</span><div class="section-actions"><span class="hint">点号码切换阵营</span><button class="privacy-btn" id="hideRolesBtn" type="button">🙈 隐藏身份</button></div></div><div class="players" id="players"></div></section><section class="card section" style="margin-top:16px"><div class="section-title"><span>📌 关键信息 / 推理</span></div><div class="info-form"><select id="infoSeat"></select><input class="text" id="infoText" placeholder="也可以直接手动添加"><button class="primary" id="addInfo" type="button">添加</button></div><div class="list" id="infoList"></div></section></div><div><section class="card section"><div class="section-title"><span>时间线</span></div><div class="timeline-head"><span class="phase" id="phaseLabel">N1</span><button class="phase-btn" id="prevPhase" type="button">←</button><button class="phase-btn" id="nextPhase" type="button">下一阶段 →</button></div><div class="timeline-form"><select id="timelineSeat"></select><input class="text" id="timelineText" placeholder="这一夜 / 今天发生了什么"><button class="primary" id="addTimeline" type="button">记录</button></div><div class="timeline-list" id="timelineList"></div></section></div></div><div class="footer">自动保存在当前浏览器 · 不上传任何内容</div></div>
<script>
(function(){
const KEY='botc-player-notes-v1';
const standard={5:[3,0,1,1],6:[3,1,1,1],7:[5,0,1,1],8:[5,1,1,1],9:[5,2,1,1],10:[7,0,2,1],11:[7,1,2,1],12:[7,2,2,1],13:[9,0,3,1],14:[9,1,3,1],15:[9,2,3,1]};
let state={started:false,playerCount:12,mySeat:0,config:[7,2,2,1],roles:{},dead:{},claimTeam:{},judgement:{},notes:{},notesCollapsed:{},info:[],phaseIndex:0,timeline:[],setupCollapsed:false,hideRoles:false};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)state=Object.assign({},state,s)}catch(e){}['roles','dead','claimTeam','judgement','notes','notesCollapsed'].forEach(k=>state[k]=state[k]||{});state.info=state.info||[];state.timeline=state.timeline||[];state.mySeat=Number(state.mySeat)||0;state.hideRoles=!!state.hideRoles}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function defaultConfig(n){return standard[n]?[...standard[n]]:[Math.max(0,n-3),1,1,1]}
function phaseName(i){return(i%2===0?'N':'D')+(Math.floor(i/2)+1)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function seatOptions(){let x='<option value="">全局</option>';for(let i=1;i<=state.playerCount;i++)x+='<option value="'+i+'">'+i+'号</option>';return x}
function renderSetup(){const c=document.getElementById('setupCard'),v=!!state.setupCollapsed;c.classList.toggle('collapsed',v);document.getElementById('setupToggle').setAttribute('aria-expanded',String(!v));document.getElementById('setupArrow').textContent=v?'⌄':'⌃';document.getElementById('setupSummaryText').textContent=state.playerCount+'人 · '+state.config.map(Number).join(' / ')+(state.mySeat?' · 我:'+state.mySeat:'')}
function renderPrivacy(){const b=document.getElementById('hideRolesBtn');b.textContent=state.hideRoles?'👁 显示身份':'🙈 隐藏身份';b.classList.toggle('hidden-on',state.hideRoles)}
function renderAll(){document.getElementById('boot').classList.toggle('hidden',state.started);document.getElementById('playerCount').value=state.playerCount;document.getElementById('mySeat').value=state.mySeat||'';['townsfolk','outsiders','minions','demons'].forEach((id,i)=>document.getElementById(id).value=state.config[i]||0);const total=state.config.reduce((a,b)=>Number(a)+Number(b),0);document.getElementById('cfgHint').textContent=total===state.playerCount?'合计正确':'当前合计 '+total+'，与 '+state.playerCount+' 人不同';renderSetup();renderPrivacy();renderPlayers();document.getElementById('infoSeat').innerHTML=seatOptions();document.getElementById('timelineSeat').innerHTML=seatOptions();document.getElementById('phaseLabel').textContent=phaseName(state.phaseIndex);renderInfo();renderTimeline()}
function noteListFor(s){return state.notes[s]||[]}
function judgeLabel(v){return v==='suspect'?'怀疑':v==='confirm'?'确认':'判断'}
function nextTeam(v){return v===''?'town':v==='town'?'outsider':v==='outsider'?'wolf':''}
function nextJudge(v){return v===''?'suspect':v==='suspect'?'confirm':''}
function roleInput(i){const role=state.roles[i]||'';if(state.hideRoles)return '<input class="role masked" value="'+(role?'••••':'')+'" placeholder="身份已隐藏" readonly aria-label="隐藏身份">';return '<input class="role" data-role="'+i+'" value="'+esc(role)+'" placeholder="身份">'}
function renderPlayers(){const box=document.getElementById('players');let html='';for(let i=1;i<=state.playerCount;i++){const dead=!!state.dead[i],team=state.claimTeam[i]||'',judge=state.judgement[i]||'',notes=noteListFor(i),collapsed=state.notesCollapsed[i]!==false,mine=Number(state.mySeat)===i;html+='<div class="player '+(dead?'dead':'')+'"><button class="seat '+team+' '+(mine?'mine':'')+'" type="button" data-team-cycle="'+i+'" title="点一下切换阵营">'+i+'</button>'+roleInput(i)+'<button class="state-tag '+judge+'" type="button" data-judge-cycle="'+i+'">'+judgeLabel(judge)+'</button><button class="status" type="button" data-status="'+i+'">'+(dead?'💀':'○')+'</button><button class="notes-toggle '+(notes.length?'has-notes':'')+'" type="button" data-notes-toggle="'+i+'">备注'+(notes.length?'·'+notes.length:'')+(collapsed?'⌄':'⌃')+'</button><div class="player-notes '+(collapsed?'collapsed':'')+'"><div class="note-form"><input class="note-input" data-note-input="'+i+'" placeholder="记一句他说过的话"><button class="note-add" type="button" data-note-add="'+i+'">＋</button></div><div class="note-list">'+(notes.length?notes.map(n=>'<div class="note-row '+(n.pinned?'pinned':'')+'"><input class="note-check" type="checkbox" '+(n.pinned?'checked':'')+' data-note-pin-seat="'+i+'" data-note-id="'+n.id+'"><div class="note-text">'+esc(n.text)+'</div><button class="note-del" type="button" data-note-del-seat="'+i+'" data-note-id="'+n.id+'">×</button></div>').join(''):'<div class="note-empty">重要的话勾选后会自动进入关键信息。</div>')+'</div></div></div>'}box.innerHTML=html;
box.querySelectorAll('[data-role]').forEach(e=>e.oninput=x=>{state.roles[x.target.dataset.role]=x.target.value;save()});box.querySelectorAll('[data-status]').forEach(e=>e.onclick=x=>{const n=x.currentTarget.dataset.status;state.dead[n]=!state.dead[n];save();renderPlayers()});box.querySelectorAll('[data-team-cycle]').forEach(e=>e.onclick=x=>{const n=x.currentTarget.dataset.teamCycle;state.claimTeam[n]=nextTeam(state.claimTeam[n]||'');save();renderPlayers()});box.querySelectorAll('[data-judge-cycle]').forEach(e=>e.onclick=x=>{const n=x.currentTarget.dataset.judgeCycle;state.judgement[n]=nextJudge(state.judgement[n]||'');save();renderPlayers()});box.querySelectorAll('[data-notes-toggle]').forEach(e=>e.onclick=x=>{const n=x.currentTarget.dataset.notesToggle;state.notesCollapsed[n]=state.notesCollapsed[n]===false;save();renderPlayers()});box.querySelectorAll('[data-note-add]').forEach(e=>e.onclick=x=>addPlayerNote(x.currentTarget.dataset.noteAdd));box.querySelectorAll('[data-note-input]').forEach(e=>e.onkeydown=x=>{if(x.key==='Enter'){x.preventDefault();addPlayerNote(x.currentTarget.dataset.noteInput)}});box.querySelectorAll('[data-note-pin-seat]').forEach(e=>e.onchange=x=>toggleNotePin(x.currentTarget.dataset.notePinSeat,x.currentTarget.dataset.noteId,x.currentTarget.checked));box.querySelectorAll('[data-note-del-seat]').forEach(e=>e.onclick=x=>deletePlayerNote(x.currentTarget.dataset.noteDelSeat,x.currentTarget.dataset.noteId))}
function addPlayerNote(seat){const input=document.querySelector('[data-note-input="'+seat+'"]');if(!input)return;const text=input.value.trim();if(!text)return;if(!state.notes[seat])state.notes[seat]=[];state.notes[seat].push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),text,pinned:false});state.notesCollapsed[seat]=false;save();renderPlayers();renderInfo();setTimeout(()=>{const x=document.querySelector('[data-note-input="'+seat+'"]');if(x)x.focus()},0)}
function findNote(seat,id){return noteListFor(seat).find(n=>String(n.id)===String(id))}
function toggleNotePin(seat,id,value){const n=findNote(seat,id);if(!n)return;n.pinned=!!value;save();renderPlayers();renderInfo()}
function deletePlayerNote(seat,id){state.notes[seat]=noteListFor(seat).filter(n=>String(n.id)!==String(id));save();renderPlayers();renderInfo()}
function pinnedNotes(){const out=[];Object.keys(state.notes).forEach(seat=>noteListFor(seat).forEach(n=>{if(n.pinned)out.push({seat:String(seat),text:n.text,noteId:String(n.id)})}));return out}
function renderInfo(){const box=document.getElementById('infoList'),manual=state.info.map((x,idx)=>({kind:'manual',idx,seat:x.seat,text:x.text})),pinned=pinnedNotes().map(x=>({kind:'note',...x})),all=manual.concat(pinned);if(!all.length){box.innerHTML='<div class="empty">可以手动添加，也可以从玩家备注里勾选重要发言。</div>';return}box.innerHTML=all.map(x=>'<div class="item '+(x.kind==='note'?'from-note':'')+'"><span class="tag">'+(x.seat?x.seat+'号':'全局')+'</span><div class="item-text">'+esc(x.text)+'</div><button class="del" type="button" '+(x.kind==='manual'?'data-del-info="'+x.idx+'"':'data-unpin-seat="'+x.seat+'" data-unpin-id="'+x.noteId+'"')+'>×</button></div>').join('');box.querySelectorAll('[data-del-info]').forEach(b=>b.onclick=()=>{state.info.splice(Number(b.dataset.delInfo),1);save();renderInfo()});box.querySelectorAll('[data-unpin-seat]').forEach(b=>b.onclick=()=>{const n=findNote(b.dataset.unpinSeat,b.dataset.unpinId);if(n)n.pinned=false;save();renderPlayers();renderInfo()})}
function renderTimeline(){const box=document.getElementById('timelineList');if(!state.timeline.length){box.innerHTML='<div class="empty">从 N1 开始。新记录会自动带上当前阶段。</div>';return}const g={};state.timeline.forEach((x,idx)=>{if(!g[x.phase])g[x.phase]=[];g[x.phase].push({...x,idx})});box.innerHTML=Object.keys(g).map(p=>'<div class="phase-group"><div class="phase-label">'+p+'</div><div class="list">'+g[p].map(x=>'<div class="item"><span class="tag">'+(x.seat?x.seat+'号':'全局')+'</span><div class="item-text">'+esc(x.text)+'</div><button class="del" type="button" data-del-time="'+x.idx+'">×</button></div>').join('')+'</div></div>').join('');box.querySelectorAll('[data-del-time]').forEach(b=>b.onclick=()=>{state.timeline.splice(Number(b.dataset.delTime),1);save();renderTimeline()});box.scrollTop=box.scrollHeight}
function applyCount(n,useDefault){n=Math.max(1,Math.min(30,Number(n)||1));state.playerCount=n;[state.roles,state.dead,state.claimTeam,state.judgement,state.notes,state.notesCollapsed].forEach(o=>Object.keys(o).forEach(k=>{if(Number(k)>n)delete o[k]}));if(state.mySeat>n)state.mySeat=0;if(useDefault)state.config=defaultConfig(n);save();renderAll()}
load();renderAll();
document.getElementById('hideRolesBtn').onclick=()=>{state.hideRoles=!state.hideRoles;save();renderPrivacy();renderPlayers()};document.getElementById('setupToggle').onclick=()=>{state.setupCollapsed=!state.setupCollapsed;save();renderSetup()};document.getElementById('startBtn').onclick=()=>{const n=Math.max(1,Math.min(30,Number(document.getElementById('bootCount').value)||12));state.started=true;state.playerCount=n;state.config=defaultConfig(n);state.setupCollapsed=false;save();renderAll()};document.getElementById('applyCount').onclick=()=>applyCount(document.getElementById('playerCount').value,true);document.getElementById('mySeat').oninput=e=>{const raw=e.target.value.trim();state.mySeat=raw?Math.max(1,Math.min(state.playerCount,Number(raw)||0)):0;save();renderSetup();renderPlayers()};document.getElementById('standardCfg').onclick=()=>{state.config=defaultConfig(state.playerCount);save();renderAll()};['townsfolk','outsiders','minions','demons'].forEach((id,i)=>document.getElementById(id).oninput=e=>{state.config[i]=Math.max(0,Number(e.target.value)||0);save();renderAll()});document.getElementById('addInfo').onclick=()=>{const input=document.getElementById('infoText'),text=input.value.trim();if(!text)return;state.info.push({seat:document.getElementById('infoSeat').value,text});input.value='';save();renderInfo()};document.getElementById('infoText').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('addInfo').click()}};document.getElementById('addTimeline').onclick=()=>{const input=document.getElementById('timelineText'),text=input.value.trim();if(!text)return;state.timeline.push({phase:phaseName(state.phaseIndex),seat:document.getElementById('timelineSeat').value,text});input.value='';save();renderTimeline()};document.getElementById('timelineText').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('addTimeline').click()}};document.getElementById('nextPhase').onclick=()=>{state.phaseIndex++;save();renderAll()};document.getElementById('prevPhase').onclick=()=>{state.phaseIndex=Math.max(0,state.phaseIndex-1);save();renderAll()};document.getElementById('clearAll').onclick=()=>{if(!confirm('确定开始新的一局？当前笔记会被清空。'))return;localStorage.removeItem(KEY);state={started:false,playerCount:12,mySeat:0,config:[7,2,2,1],roles:{},dead:{},claimTeam:{},judgement:{},notes:{},notesCollapsed:{},info:[],phaseIndex:0,timeline:[],setupCollapsed:false,hideRoles:false};document.getElementById('bootCount').value=12;renderAll()}
})();
