<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>血染钟楼 · 玩家笔记</title>
<style>
  :root{--bg:#f4f1ea;--paper:#fffdf8;--ink:#24211d;--muted:#7e776d;--line:#ddd5c8;--soft:#eee8de;--shadow:0 8px 30px rgba(50,40,25,.08);--radius:16px}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif} button,input,select{font:inherit} button{cursor:pointer}
  .app{max-width:1120px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.96);backdrop-filter:blur(12px);padding:8px 0 12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .setup{padding:14px 16px}.setup-line{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.title{font-size:20px;font-weight:800;margin-right:auto}.small-label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}.count-wrap{display:flex;align-items:center;gap:7px}.number{width:62px;padding:8px;border:1px solid var(--line);border-radius:10px;background:white;text-align:center}
  .config{margin-top:12px;padding-top:12px;border-top:1px solid var(--soft);display:flex;align-items:end;gap:10px;flex-wrap:wrap}.cfg{display:flex;flex-direction:column;gap:3px}.cfg input{width:62px;padding:8px;border:1px solid var(--line);border-radius:10px;text-align:center;background:white}.slash{color:var(--muted);padding-bottom:9px;font-weight:700}.hint{font-size:12px;color:var(--muted);margin-left:4px}.ghost{border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:8px 11px}
  .main-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:16px;margin-top:16px}.section{padding:16px}.section-title{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px;margin-bottom:12px}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.player{display:grid;grid-template-columns:42px minmax(0,1fr) 34px;align-items:center;gap:8px;border:1px solid var(--soft);border-radius:12px;padding:7px;background:#fff}.seat{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:800;font-size:14px;user-select:none}.role{width:100%;border:0;outline:0;padding:7px 3px;background:transparent;font-size:15px}.status{width:30px;height:30px;border:0;border-radius:50%;background:transparent;font-size:18px;padding:0}.player.dead{opacity:.52}.player.dead .role{text-decoration:line-through}.player.dead .seat{background:#d8d3cb}
  .info-form,.timeline-form{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:8px;margin-bottom:10px}select,input.text{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none;padding:9px 10px}.primary{border:0;border-radius:10px;background:var(--ink);color:white;padding:9px 13px;font-weight:700}.list{display:flex;flex-direction:column;gap:7px}.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;background:#fff;border:1px solid var(--soft);border-radius:11px;padding:9px 10px}.tag{white-space:nowrap;background:var(--soft);border-radius:8px;padding:3px 7px;font-weight:700;font-size:12px}.item-text{white-space:pre-wrap;word-break:break-word;line-height:1.45}.del{border:0;background:transparent;color:#a39a8e;font-size:16px;padding:0 3px}.timeline-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.phase{font-size:22px;font-weight:900;min-width:44px}.phase-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px}.timeline-list{max-height:420px;overflow:auto;padding-right:2px}.phase-group{margin-top:12px}.phase-group:first-child{margin-top:0}.phase-label{position:sticky;top:0;background:var(--paper);font-size:13px;font-weight:900;color:var(--muted);padding:5px 0}.empty{font-size:13px;color:var(--muted);padding:12px 2px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:18px 4px 28px}
  .boot{position:fixed;inset:0;background:rgba(30,27,23,.36);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:20px}.boot.hidden{display:none}.boot-box{width:min(420px,100%);padding:22px}.boot-title{font-size:24px;font-weight:900;margin-bottom:5px}.boot-sub{color:var(--muted);font-size:13px;margin-bottom:18px}.boot-row{display:flex;gap:8px}.boot-row input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:18px}.wide{padding:12px 16px}
  @media(max-width:800px){.app{padding:10px}.main-grid{grid-template-columns:1fr}.players{grid-template-columns:1fr}.top{padding-top:4px}.title{width:100%;font-size:18px}.info-form,.timeline-form{grid-template-columns:72px minmax(0,1fr)}.info-form .primary,.timeline-form .primary{grid-column:2}}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="boot-box card"><div class="boot-title">开一局</div><div class="boot-sub">输入玩家总人数。之后可以随时修改。</div><div class="boot-row"><input id="bootCount" type="number" min="1" max="30" value="12" inputmode="numeric"><button class="primary wide" id="startBtn" type="button">开始记</button></div></div></div>
<div class="app"><div class="top"><div class="card setup"><div class="setup-line"><div class="title">血染钟楼 · 玩家笔记</div><div><span class="small-label">总人数</span><div class="count-wrap"><input class="number" id="playerCount" type="number" min="1" max="30" inputmode="numeric"><button class="ghost" id="applyCount" type="button">应用</button></div></div><button class="ghost" id="clearAll" type="button">新开一局</button></div><div class="config"><div class="cfg"><span class="small-label">镇民</span><input id="townsfolk" type="number" min="0"></div><span class="slash">/</span><div class="cfg"><span class="small-label">外来者</span><input id="outsiders" type="number" min="0"></div><span class="slash">/</span><div class="cfg"><span class="small-label">爪牙</span><input id="minions" type="number" min="0"></div><span class="slash">/</span><div class="cfg"><span class="small-label">恶魔</span><input id="demons" type="number" min="0"></div><button class="ghost" id="standardCfg" type="button">恢复默认配置</button><span class="hint" id="cfgHint"></span></div></div></div>
<div class="main-grid"><div><section class="card section"><div class="section-title"><span>身份板</span><span class="hint">直接输入，例如「教授 → 农夫」「无神 / 酒鬼」</span></div><div class="players" id="players"></div></section><section class="card section" style="margin-top:16px"><div class="section-title"><span>📌 关键信息 / 推理</span></div><div class="info-form"><select id="infoSeat"></select><input class="text" id="infoText" placeholder="例如：4 6 12 出一坏"><button class="primary" id="addInfo" type="button">添加</button></div><div class="list" id="infoList"></div></section></div><div><section class="card section"><div class="section-title"><span>时间线</span></div><div class="timeline-head"><span class="phase" id="phaseLabel">N1</span><button class="phase-btn" id="prevPhase" type="button">←</button><button class="phase-btn" id="nextPhase" type="button">下一阶段 →</button></div><div class="timeline-form"><select id="timelineSeat"></select><input class="text" id="timelineText" placeholder="这一夜 / 今天发生了什么"><button class="primary" id="addTimeline" type="button">记录</button></div><div class="timeline-list" id="timelineList"></div></section></div></div><div class="footer">自动保存在当前浏览器 · 不上传任何内容</div></div>
<script>
(function(){
const KEY='botc-player-notes-v1';
const standard={5:[3,0,1,1],6:[3,1,1,1],7:[5,0,1,1],8:[5,1,1,1],9:[5,2,1,1],10:[7,0,2,1],11:[7,1,2,1],12:[7,2,2,1],13:[9,0,3,1],14:[9,1,3,1],15:[9,2,3,1]};
let state={started:false,playerCount:12,config:[7,2,2,1],roles:{},dead:{},info:[],phaseIndex:0,timeline:[]};
function load(){try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved)state=Object.assign({},state,saved)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function defaultConfig(n){return standard[n]?[...standard[n]]:[Math.max(0,n-3),1,1,1]}
function phaseName(i){const round=Math.floor(i/2)+1;return(i%2===0?'N':'D')+round}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function seatOptions(){let out='<option value="">全局</option>';for(let i=1;i<=state.playerCount;i++)out+='<option value="'+i+'">'+i+'号</option>';return out}
function renderAll(){document.getElementById('boot').classList.toggle('hidden',state.started);document.getElementById('playerCount').value=state.playerCount;['townsfolk','outsiders','minions','demons'].forEach((id,i)=>document.getElementById(id).value=state.config[i]||0);const total=state.config.reduce((a,b)=>Number(a)+Number(b),0);document.getElementById('cfgHint').textContent=total===state.playerCount?'合计正确':'当前合计 '+total+'，与 '+state.playerCount+' 人不同';renderPlayers();document.getElementById('infoSeat').innerHTML=seatOptions();document.getElementById('timelineSeat').innerHTML=seatOptions();document.getElementById('phaseLabel').textContent=phaseName(state.phaseIndex);renderInfo();renderTimeline()}
function renderPlayers(){const box=document.getElementById('players');let html='';for(let i=1;i<=state.playerCount;i++){const dead=!!state.dead[i];html+='<div class="player '+(dead?'dead':'')+'"><div class="seat">'+i+'</div><input class="role" data-role="'+i+'" value="'+esc(state.roles[i]||'')+'" placeholder="输入身份 / 猜测"><button class="status" type="button" data-status="'+i+'">'+(dead?'💀':'○')+'</button></div>'}box.innerHTML=html;box.querySelectorAll('[data-role]').forEach(el=>el.addEventListener('input',e=>{state.roles[e.target.dataset.role]=e.target.value;save()}));box.querySelectorAll('[data-status]').forEach(el=>el.addEventListener('click',e=>{const n=e.currentTarget.dataset.status;state.dead[n]=!state.dead[n];save();renderPlayers()}))}
function renderInfo(){const box=document.getElementById('infoList');if(!state.info.length){box.innerHTML='<div class="empty">把需要一直盯着的信息钉在这里。</div>';return}box.innerHTML=state.info.map((x,idx)=>'<div class="item"><span class="tag">'+(x.seat?x.seat+'号':'全局')+'</span><div class="item-text">'+esc(x.text)+'</div><button class="del" type="button" data-del-info="'+idx+'">×</button></div>').join('');box.querySelectorAll('[data-del-info]').forEach(b=>b.onclick=()=>{state.info.splice(Number(b.dataset.delInfo),1);save();renderInfo()})}
function renderTimeline(){const box=document.getElementById('timelineList');if(!state.timeline.length){box.innerHTML='<div class="empty">从 N1 开始。切换阶段后，新记录会自动带上 N1 / D1 / N2…</div>';return}const groups={};state.timeline.forEach((x,idx)=>{if(!groups[x.phase])groups[x.phase]=[];groups[x.phase].push(Object.assign({},x,{idx}))});box.innerHTML=Object.keys(groups).map(phase=>'<div class="phase-group"><div class="phase-label">'+phase+'</div><div class="list">'+groups[phase].map(x=>'<div class="item"><span class="tag">'+(x.seat?x.seat+'号':'全局')+'</span><div class="item-text">'+esc(x.text)+'</div><button class="del" type="button" data-del-time="'+x.idx+'">×</button></div>').join('')+'</div></div>').join('');box.querySelectorAll('[data-del-time]').forEach(b=>b.onclick=()=>{state.timeline.splice(Number(b.dataset.delTime),1);save();renderTimeline()});box.scrollTop=box.scrollHeight}
function applyCount(n,useDefault){n=Math.max(1,Math.min(30,Number(n)||1));state.playerCount=n;Object.keys(state.roles).forEach(k=>{if(Number(k)>n)delete state.roles[k]});Object.keys(state.dead).forEach(k=>{if(Number(k)>n)delete state.dead[k]});if(useDefault)state.config=defaultConfig(n);save();renderAll()}
load();renderAll();
document.getElementById('startBtn').addEventListener('click',function(){const n=Math.max(1,Math.min(30,Number(document.getElementById('bootCount').value)||12));state.started=true;state.playerCount=n;state.config=defaultConfig(n);save();renderAll()});
document.getElementById('applyCount').onclick=()=>applyCount(document.getElementById('playerCount').value,true);document.getElementById('standardCfg').onclick=()=>{state.config=defaultConfig(state.playerCount);save();renderAll()};
['townsfolk','outsiders','minions','demons'].forEach((id,i)=>document.getElementById(id).addEventListener('input',e=>{state.config[i]=Math.max(0,Number(e.target.value)||0);save();const total=state.config.reduce((a,b)=>a+Number(b),0);document.getElementById('cfgHint').textContent=total===state.playerCount?'合计正确':'当前合计 '+total+'，与 '+state.playerCount+' 人不同'}));
document.getElementById('addInfo').onclick=()=>{const input=document.getElementById('infoText');const text=input.value.trim();if(!text)return;state.info.push({seat:document.getElementById('infoSeat').value,text});input.value='';save();renderInfo()};document.getElementById('infoText').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('addInfo').click()}});
document.getElementById('addTimeline').onclick=()=>{const input=document.getElementById('timelineText');const text=input.value.trim();if(!text)return;state.timeline.push({phase:phaseName(state.phaseIndex),seat:document.getElementById('timelineSeat').value,text});input.value='';save();renderTimeline()};document.getElementById('timelineText').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('addTimeline').click()}});
document.getElementById('nextPhase').onclick=()=>{state.phaseIndex++;save();renderAll()};document.getElementById('prevPhase').onclick=()=>{state.phaseIndex=Math.max(0,state.phaseIndex-1);save();renderAll()};document.getElementById('clearAll').onclick=()=>{if(!confirm('确定开始新的一局？当前笔记会被清空。'))return;localStorage.removeItem(KEY);state={started:false,playerCount:12,config:[7,2,2,1],roles:{},dead:{},info:[],phaseIndex:0,timeline:[]};document.getElementById('bootCount').value=12;renderAll()};
})();
</script>
</body>
</html>
