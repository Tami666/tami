name: Patch classic script selector once

on:
  push:
    paths:
      - '.github/workflows/patch-classic.yml'
      - 'tools/patch_classic.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch index.html
        run: python tools/patch_classic.py
      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add classic script selector and role info popover"
          git push origin master
